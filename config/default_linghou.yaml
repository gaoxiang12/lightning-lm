# 针对灵猴机器人的配置
common:
  dataset: "linghou"
  lidar_topic: "/driver/lidar/point_cloud/Data"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/driver/imu/Data"
  debug: false                    # 调试模式：打印详细日志

# ====== LIO 公共参数 (两种前端共用) ======
lio_common:
  lidar_type: 4                # 1=Livox, 2=Velodyne, 3=Ouster, 4=RoboSense
  scan_line: 128               # 雷达线数
  blind: 0.5                   # 盲区距离
  point_filter_num: 4          # 点云降采样（每 N 个点保留 1 个）
  filter_size_scan: 0.5        # 体素降采样分辨率
  filter_size_map: 0.5         # 地图体素分辨率
  max_iteration: 4             # EKF 最大迭代次数
  acc_cov: 0.1                 # 加速度计噪声协方差
  gyr_cov: 0.1                 # 陀螺仪噪声协方差
  b_acc_cov: 0.0001            # 加速度计偏置协方差
  b_gyr_cov: 0.0001            # 陀螺仪偏置协方差
  extrinsic_T: [0, 0, 0.0]    # LiDAR-IMU 平移
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]  # LiDAR-IMU 旋转（单位阵）

# ====== fasterlio 专用参数 ======
fasterlio:
  # 以下参数从 lio_common 继承: lidar_type, scan_line, blind, point_filter_num,
  #   filter_size_scan, filter_size_map, max_iteration, acc_cov, gyr_cov,
  #   b_acc_cov, b_gyr_cov, extrinsic_T, extrinsic_R

  time_scale: 1e-3             # 时间缩放，仅对 Velodyne(lidar_type=2) 生效
  skip_lidar_num: 0            # 点云跳帧
  ivox_grid_resolution: 0.5    # iVox 网格分辨率
  ivox_nearby_type: 18         # iVox 搜索邻居数 (6, 18, 26)
  esti_plane_threshold: 0.1    # 平面估计阈值
  use_aa: false                # Anderson 加速
  extrinsic_est_en: false      # 在线外参估计
  keep_first_imu_estimation: false
  kf_dis_th: 2.0               # 关键帧距离阈值
  kf_angle_th: 5.0             # 关键帧角度阈值 (度)
  enable_icp_part: true        # 点到点 ICP
  plane_icp_weight: 500.0      # 点到面 ICP 权重
  min_pts: 300                 # 最小特征点数
  imu_filter: true             # IMU 低通滤波
  proj_kfs: false              # 关键帧投影


g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -0.35
  min_th_floor: 0.02
  max_th_floor: 1.0
  grid_map_resolution: 0.02

system:
  mapping_frontend: "aa_fasterlio"  # 建图前端: aa_fasterlio 或 fast_lio2
  with_loop_closing: true
  with_ui: true
  with_2dui: true
  with_g2p5: true
  step_on_kf: false

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/new_map/
  pub_tf: true

loop_closing:
  loop_kf_gap: 50
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: true


lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_polygon: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: long
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  height_max: 5.0
  height_min: -2.0
  range_max: 70
  range_min: 3.0

ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
