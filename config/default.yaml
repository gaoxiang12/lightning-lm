# 针对NCLT的配�?
common:
  dataset: "nclt"
  lidar_topic: "points_raw"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "imu_raw"

# fasterlio 参数
fasterlio:
  lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
  scan_line: 32
  blind: 0.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情�?
  point_filter_num: 10 # 点云采样参数
  max_iteration: 6 # 最大迭代次�?
  filter_size_scan: 0.5 # 对scan进行的降采样
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: true  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0, 0, 0.28 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false


g2p5:
  esti_floor: false   # 是否动态估计地�?
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.50  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.2 # 栅格地图分辨�?

system:
  frontend_type: "faster_lio" # options: faster_lio, lio_sam
  with_loop_closing: true # 是否需要回环检�?
  with_ui: true # 是否需�?D UI
  with_2dui: false # 是否需�?D UI
  with_g2p5: true # 是否需要栅格地�?
  step_on_kf: false # 是否在关键帧处暂�?

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/new_map/
  pub_tf: true

loop_closing:
  loop_kf_gap: 20       # 每隔多少个关键帧检查一�?
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 50     # 历史关键帧与当前帧的ID间隔
  max_range: 30.0       # 候选帧的最大距�?
  ndt_score_th: 1.0     # ndt位姿分�?
  with_height: true


### localization ================================================================================================
localization:
  mode: "localization"
  # mode: "dual_lidar_online_calibration"
  # mode: "localization_with_dual_lidar_calib_monitor"

dual_lidar_online_calibration:
  front_lidar_topic: "/front_lidar/points"
  rear_lidar_topic: "/rear_lidar/points"
  sync_tolerance: 0.02
  max_queue_size: 20
  publish_tf: false
  registration_method: "gicp"   # gicp or icp
  voxel_leaf_size: 0.3
  blind: 0.5
  point_filter_num: 1
  min_points: 1000
  max_iterations: 40
  max_correspondence_distance: 2.0
  transformation_epsilon: 1.0e-6
  euclidean_fitness_epsilon: 1.0e-5
  fitness_score_max_range: 2.0
  max_fitness_score: 1.0
  max_innovation_translation: 2.0
  max_innovation_rotation_deg: 20.0
  initial_translation: [0.0, 0.0, 0.0]
  initial_rpy_deg: [0.0, 0.0, 0.0]
  process_noise:
    translation_std: 0.0005
    rotation_std_deg: 0.005
  initial_covariance:
    translation_std: 1.0
    rotation_std_deg: 10.0
  measurement_noise:
    translation_std: 0.05
    rotation_std_deg: 1.0
    fitness_translation_scale: 1.0
    fitness_rotation_scale_deg: 5.0
  output_interval: 10
  output_yaml_path: "./dual_lidar_online_calibration.yaml"

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1

# Used only when system.frontend is "lio_sam".
lio_sam:
  sensor: "velodyne"
  N_SCAN: 32
  Horizon_SCAN: 1800
  downsampleRate: 1
  lidarMinRange: 0.5
  lidarMaxRange: 1000.0
  lidarFrame: "lidar_link"
  baselinkFrame: "base_link"
  odometryFrame: "odom"
  mapFrame: "map"
  odomTopic: "lio_sam/odometry/imu"
  edgeThreshold: 1.0
  surfThreshold: 0.1
  edgeFeatureMinValidNum: 10
  surfFeatureMinValidNum: 100
  odometrySurfLeafSize: 0.4
  mappingCornerLeafSize: 0.2
  mappingSurfLeafSize: 0.4
  numberOfCores: 4
  mappingProcessInterval: 0.15
  surroundingkeyframeAddingDistThreshold: 1.0
  surroundingkeyframeAddingAngleThreshold: 0.2
  surroundingKeyframeDensity: 2.0
  surroundingKeyframeSearchRadius: 50.0
  loopClosureEnableFlag: false

  # Motion gate settings
  mappingLowSpeedMaxTranslationSpeed: 0.8
  mappingMotionGateEnable: true
  mappingIcpFallbackEnable: false
  mappingMotionMaxSpeed: 3.0
  mappingMotionMaxAngularVelocity: 90.0
  mappingMotionMaxCurvature: 2.0
  mappingMotionMaxRollPitchDeg: 20.0
  mappingFallbackIcpSkipOnBadLmMotion: true
